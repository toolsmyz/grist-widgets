<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekt-Pinnwand</title>
<!-- Grist Plugin API. Alternativ von deinem eigenen Server laden: https://DEIN-GRIST/grist-plugin-api.js -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #dfe4e8;
    --dot: #c3cad1;
    --ink: #22282e;
    --muted: #5b6670;
    --bar: #f7f9fa;
    --line: #c9d0d6;
    --accent: #2f6f8f;
    --note-w: 210px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--board);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 6px 10px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .toolbar button {
    font: inherit; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--accent); }
  .toolbar button:focus-visible, .note:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toolbar .status { margin-left: auto; color: var(--muted); }
  .viewport { flex: 1; overflow: auto; position: relative; touch-action: none; }
  .board {
    position: relative;
    transform-origin: 0 0;
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
  }
  .note {
    position: absolute;
    width: var(--note-w);
    min-height: 120px;
    padding: 18px 14px 12px;
    background: var(--c, #fff3a8);
    border-radius: 2px 2px 14px 2px;
    box-shadow: 0 1px 1px rgba(30,40,50,.18), 0 6px 14px -6px rgba(30,40,50,.35);
    transform: rotate(var(--tilt, 0deg));
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .note::before { /* Pin */
    content: ""; position: absolute; top: 5px; left: 50%;
    width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
    background: #b5473a; box-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .note.dragging {
    cursor: grabbing; z-index: 9999;
    transform: rotate(0deg) scale(1.04);
    box-shadow: 0 2px 2px rgba(30,40,50,.15), 0 16px 28px -8px rgba(30,40,50,.45);
  }
  .note.selected { outline: 2px solid var(--accent); outline-offset: 3px; }
  .note h3 {
    margin: 0 0 6px;
    font-family: "Kalam", "Comic Sans MS", cursive;
    font-weight: 700; font-size: 19px; line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .note .people { font-size: 14px; line-height: 1.35; margin-bottom: 6px; }
  .note .time { font-size: 13px; color: var(--muted); }
  .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5;
  }
  @media (prefers-reduced-motion: no-preference) {
    .note { transition: box-shadow .15s, transform .15s; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="zoomOut" title="Verkleinern">−</button>
    <button id="zoomIn" title="Vergrößern">+</button>
    <button id="arrangeNew" title="Zettel ohne Position im Raster ablegen">Neue anordnen</button>
    <button id="arrangeAll" title="Alle Zettel neu im Raster anordnen">Alle neu anordnen</button>
    <span class="status" id="status"></span>
  </div>
  <div class="viewport" id="viewport">
    <div class="board" id="board"></div>
  </div>

<script>
(function () {
  const PALETTE = ['#fff3a8', '#ffd6dc', '#cdeccf', '#cfe3fb', '#ffe0b8', '#e4d8f7', '#d4f1ee'];
  const GRID_X = 240, GRID_Y = 190, MARGIN = 30;

  const board = document.getElementById('board');
  const viewport = document.getElementById('viewport');
  const statusEl = document.getElementById('status');

  let notes = [];          // gemappte Datensätze
  let mappings = null;     // Widget-Name -> Spalten-ID
  let dragging = null;     // aktiver Drag
  let pendingRender = false;
  let selectedId = null;
  let zoom = 1;

  grist.ready({
    requiredAccess: 'full',
    allowSelectBy: true,
    columns: [
      { name: 'Titel', title: 'Projektname', type: 'Any' },
      { name: 'Begleiter', title: 'Begleiter', type: 'Any', optional: true,
        description: 'Text, Referenz oder Referenzliste' },
      { name: 'Beginn', title: 'Beginn', type: 'Date,DateTime', optional: true },
      { name: 'Ende', title: 'Ende', type: 'Date,DateTime', optional: true },
      { name: 'Laufzeit', title: 'Laufzeit (Text)', type: 'Any', optional: true,
        description: 'Wenn gesetzt, wird dies statt Beginn–Ende angezeigt' },
      { name: 'Farbe', title: 'Farbe', type: 'Any', optional: true,
        description: 'Hex-Farbe (#ffcc00) oder Kategorie wie Status/Choice' },
      { name: 'PosX', title: 'Position X', type: 'Numeric,Int' },
      { name: 'PosY', title: 'Position Y', type: 'Numeric,Int' }
    ]
  });

  grist.onRecords(function (records, maps) {
    mappings = maps;
    const mapped = records.map(r => {
      const m = grist.mapColumnNames(r, { mappings: maps });
      if (m) m.id = r.id;
      return m;
    });
    if (mapped.some(m => !m)) {
      notes = [];
      showEmpty('Bitte im rechten Bereich (Creator Panel) Projektname, Position X und Position Y zuordnen.');
      return;
    }
    notes = mapped;
    if (dragging) { pendingRender = true; return; }
    render();
  });

  grist.onRecord(function (rec) {
    selectedId = rec ? rec.id : null;
    board.querySelectorAll('.note').forEach(el =>
      el.classList.toggle('selected', Number(el.dataset.id) === selectedId));
  });

  // ---------- Hilfsfunktionen ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function toText(v) {
    if (v === null || v === undefined || v === '') return '';
    if (Array.isArray(v)) return v.filter(x => x !== null && x !== '').map(toText).join(', ');
    if (typeof v === 'object' && v.name) return v.name;
    return String(v);
  }
  function fmtDate(v) {
    if (v === null || v === undefined || v === '') return '';
    let d = v instanceof Date ? v : (typeof v === 'number' ? new Date(v * 1000) : new Date(v));
    if (isNaN(d)) return String(v);
    return d.toLocaleDateString('de-DE', { timeZone: 'UTC', day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function hash(s) {
    let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0;
    return Math.abs(h);
  }
  function colorFor(n) {
    const f = n.Farbe;
    if (typeof f === 'string' && /^#[0-9a-f]{3,8}$/i.test(f.trim())) return f.trim();
    if (f !== null && f !== undefined && f !== '') return PALETTE[hash(toText(f)) % PALETTE.length];
    return PALETTE[0];
  }
  function hasPos(n) {
    return typeof n.PosX === 'number' && typeof n.PosY === 'number' && !(n.PosX === 0 && n.PosY === 0);
  }
  function showEmpty(msg) {
    board.innerHTML = '';
    board.style.width = '100%'; board.style.height = '100%';
    const div = document.createElement('div');
    div.className = 'empty'; div.textContent = msg;
    board.appendChild(div);
    statusEl.textContent = '';
  }

  // ---------- Darstellung ----------
  function render() {
    if (!notes.length) { showEmpty('Keine Projekte in dieser Ansicht. Filter prüfen oder Projekte anlegen.'); return; }
    board.innerHTML = '';
    const fallback = gridPositions(notes.filter(n => !hasPos(n)), maxY());
    let maxX = 0, maxYv = 0;

    notes.forEach(n => {
      const pos = hasPos(n) ? { x: n.PosX, y: n.PosY } : fallback.get(n.id);
      const el = document.createElement('div');
      el.className = 'note' + (n.id === selectedId ? ' selected' : '');
      el.tabIndex = 0;
      el.dataset.id = n.id;
      el.style.left = pos.x + 'px';
      el.style.top = pos.y + 'px';
      el.style.setProperty('--c', colorFor(n));
      el.style.setProperty('--tilt', ((hash(n.id) % 5) - 2) * 0.6 + 'deg');

      const people = toText(n.Begleiter);
      let time = toText(n.Laufzeit);
      if (!time && (n.Beginn || n.Ende)) time = [fmtDate(n.Beginn), fmtDate(n.Ende)].filter(Boolean).join(' – ');

      el.innerHTML =
        '<h3>' + esc(toText(n.Titel) || 'Ohne Titel') + '</h3>' +
        (people ? '<div class="people">' + esc(people) + '</div>' : '') +
        (time ? '<div class="time">' + esc(time) + '</div>' : '');

      el.addEventListener('pointerdown', startDrag);
      el.addEventListener('keydown', keyMove);
      board.appendChild(el);
      maxX = Math.max(maxX, pos.x); maxYv = Math.max(maxYv, pos.y);
    });

    board.style.width = Math.max(maxX + 600, viewport.clientWidth / zoom) + 'px';
    board.style.height = Math.max(maxYv + 500, viewport.clientHeight / zoom) + 'px';
    board.style.transform = 'scale(' + zoom + ')';
    const unplaced = notes.filter(n => !hasPos(n)).length;
    statusEl.textContent = notes.length + ' Projekte' + (unplaced ? ', ' + unplaced + ' ohne gespeicherte Position' : '');
  }

  function maxY() {
    const ys = notes.filter(hasPos).map(n => n.PosY);
    return ys.length ? Math.max(...ys) + GRID_Y : MARGIN;
  }
  function gridPositions(list, startY) {
    const cols = Math.max(1, Math.floor((viewport.clientWidth / zoom - MARGIN) / GRID_X));
    const map = new Map();
    list.forEach((n, i) => map.set(n.id, {
      x: MARGIN + (i % cols) * GRID_X,
      y: startY + Math.floor(i / cols) * GRID_Y
    }));
    return map;
  }

  // ---------- Speichern ----------
  async function save(updates) {
    if (!updates.length || !mappings) return;
    statusEl.textContent = 'Speichere …';
    try {
      await grist.selectedTable.update(updates.map(u => ({
        id: u.id,
        fields: { [mappings.PosX]: Math.round(u.x), [mappings.PosY]: Math.round(u.y) }
      })));
    } catch (e) {
      console.error(e);
      statusEl.textContent = 'Position nicht gespeichert: Zugriffsstufe „Full document access“ erteilen.';
    }
  }

  // ---------- Drag & Drop ----------
  function startDrag(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const el = e.currentTarget;
    const id = Number(el.dataset.id);
    el.setPointerCapture(e.pointerId);
    dragging = {
      el, id, moved: false,
      startX: e.clientX, startY: e.clientY,
      origX: parseFloat(el.style.left), origY: parseFloat(el.style.top)
    };
    el.addEventListener('pointermove', onDrag);
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }
  function onDrag(e) {
    if (!dragging) return;
    const dx = (e.clientX - dragging.startX) / zoom;
    const dy = (e.clientY - dragging.startY) / zoom;
    if (!dragging.moved && Math.hypot(dx, dy) < 4) return;
    if (!dragging.moved) { dragging.moved = true; dragging.el.classList.add('dragging'); }
    dragging.el.style.left = Math.max(0, dragging.origX + dx) + 'px';
    dragging.el.style.top = Math.max(0, dragging.origY + dy) + 'px';
  }
  async function endDrag(e) {
    if (!dragging) return;
    const d = dragging;
    d.el.removeEventListener('pointermove', onDrag);
    d.el.removeEventListener('pointerup', endDrag);
    d.el.removeEventListener('pointercancel', endDrag);
    d.el.classList.remove('dragging');
    dragging = null;
    if (d.moved) {
      const x = parseFloat(d.el.style.left), y = parseFloat(d.el.style.top);
      const n = notes.find(n => n.id === d.id);
      if (n) { n.PosX = x; n.PosY = y; }
      await save([{ id: d.id, x, y }]);
    } else {
      grist.setCursorPos({ rowId: d.id }); // Klick: Datensatz auswählen (für verknüpfte Widgets)
    }
    if (pendingRender) { pendingRender = false; render(); }
  }
  function keyMove(e) {
    const step = e.shiftKey ? 50 : 10;
    const delta = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (e.key === 'Enter') { grist.setCursorPos({ rowId: Number(e.currentTarget.dataset.id) }); return; }
    if (!delta) return;
    e.preventDefault();
    const el = e.currentTarget;
    const x = Math.max(0, parseFloat(el.style.left) + delta[0]);
    const y = Math.max(0, parseFloat(el.style.top) + delta[1]);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    clearTimeout(el._t);
    el._t = setTimeout(() => save([{ id: Number(el.dataset.id), x, y }]), 400);
  }

  // ---------- Toolbar ----------
  function setZoom(z) { zoom = Math.min(1.6, Math.max(0.4, z)); render(); }
  document.getElementById('zoomIn').onclick = () => setZoom(zoom + 0.1);
  document.getElementById('zoomOut').onclick = () => setZoom(zoom - 0.1);
  document.getElementById('arrangeNew').onclick = () => {
    const list = notes.filter(n => !hasPos(n));
    const pos = gridPositions(list, maxY());
    save(list.map(n => ({ id: n.id, ...pos.get(n.id) })));
  };
  document.getElementById('arrangeAll').onclick = () => {
    if (!confirm('Alle Zettel im Raster neu anordnen? Die bisherigen Positionen gehen verloren.')) return;
    const pos = gridPositions(notes, MARGIN);
    save(notes.map(n => ({ id: n.id, ...pos.get(n.id) })));
  };
  window.addEventListener('resize', () => { if (!dragging && notes.length) render(); });
})();
</script>
</body>
</html>
